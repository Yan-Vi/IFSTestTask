name: Test and Report

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CONFIG: Release
      IFS_TEST_CONFIG: ${{ vars.IFS_TEST_CONFIG || 'debug' }}
      VERBOSITY: ${{ vars.VERBOSITY || 'normal' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.x"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/IFSTests.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run Tests
        run: dotnet test --configuration ${{ env.CONFIG }} --verbosity ${{ env.VERBOSITY }}
        continue-on-error: true

      - name: Generate Allure 3 report
        run: npx -y allure@3.7.0 awesome IFSTests/bin/${{ env.CONFIG }}/net9.0/allure-results --single-file

      - name: Allure Report
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: allure-framework/allure-action@v0.6.6
        with:
          report-directory: ./allure-report
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Allure HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ github.run_id }}
          path: allure-report
          if-no-files-found: warn
          retention-days: 30

  deploy-gh-pages:
    needs: test
    if: >
      needs.test.result == 'success' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: allure-report-${{ github.run_id }}
          path: allure-report

      - name: Deploy PR Allure report
        if: github.event_name == 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.7.2
        with:
          branch: gh-pages
          folder: allure-report
          target-folder: pr/${{ github.event.pull_request.number }}
          clean: false

      - name: Deploy main Allure report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4.7.2
        with:
          branch: gh-pages
          folder: allure-report
          clean: true
          clean-exclude: |
            pr/**
